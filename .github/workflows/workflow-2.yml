name: learn github actions
run-name: ${{ github.actor}} is having fun learning
on: [push]
jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g bat
      - run: bats -v
